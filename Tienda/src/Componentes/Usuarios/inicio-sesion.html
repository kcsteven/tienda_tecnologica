<section class="inicio-sesion py-5">
  <div class="container">
    <div class="inicio-sesion__card mx-auto">
      <h1>Iniciar sesión</h1>
      <p class="text-muted">Ingresa con tus credenciales para continuar.</p>

      @if (mensajeError) {
      <div class="alert alert-danger" role="alert">{{ mensajeError }}</div>
      }

      <form [formGroup]="formulario" (ngSubmit)="iniciarSesion()" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input id="email"
                 type="email"
                 class="form-control"
                 formControlName="email"
                 maxlength="100"
                 autocomplete="email" />
          @if (campoInvalido('email')) {
          <small class="text-danger">{{ mensajeCampo('email') }}</small>
          }
        </div>

        <div class="mb-3">
          <label for="contrasena" class="form-label">Contraseña</label>
          <input id="contrasena"
                 type="password"
                 class="form-control"
                 formControlName="contrasena"
                 maxlength="128"
                 autocomplete="current-password" />
          @if (campoInvalido('contrasena')) {
          <small class="text-danger">{{ mensajeCampo('contrasena') }}</small>
          }
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="enviando">
          {{ enviando ? 'Ingresando...' : 'Iniciar sesión' }}
        </button>
      </form>

      <p class="text-center text-muted mt-3 mb-0">
        ¿No tienes una cuenta? <a routerLink="/registro">Regístrate</a>
      </p>
    </div>
  </div>
</section>
